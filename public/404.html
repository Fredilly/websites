<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found | Article6 Studio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@300..600&display=swap">
<style>
:root { --paper:#F5F6F8; --ink:#101215; --muted:#5F656E; --accent:#2B3FFF; --accent-ink:#fff; color-scheme: light dark; }
@media (prefers-color-scheme: dark) { :root { --paper:#0D0F12; --ink:#F2F3F5; --muted:#9AA0AA; --accent:#8493FF; --accent-ink:#0D0F12; } }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; align-items:center; padding:clamp(20px,4.5vw,64px); background:var(--paper); color:var(--ink); font:17px/1.6 "Geist", system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing:antialiased; }
main { max-width: 640px; display:grid; gap:20px; justify-items:start; }
h1 { margin:0; font-size:clamp(44px,9vw,96px); font-weight:300; line-height:1; letter-spacing:-.05em; }
p { margin:0; color:var(--muted); }
a { display:inline-flex; align-items:center; height:48px; padding:0 22px; margin-top:8px; border-radius:12px; background:var(--ink); color:var(--paper); font-size:15px; font-weight:500; text-decoration:none; transition:background .2s,color .2s; }
a:hover { background:var(--accent); color:var(--accent-ink); }
a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
@media (prefers-reduced-motion: reduce) { a { transition:none; } }
</style>
</head>
<body>
<main>
  <h1>Page not found.</h1>
  <p>That page doesn't exist or has moved.</p>
  <a href="/">Back to Article6 Studio</a>
</main>
</body>
</html>
